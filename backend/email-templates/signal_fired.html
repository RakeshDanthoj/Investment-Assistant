<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal update — FinnWise</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f1ec;font-family:Inter,Segoe UI,sans-serif;color:#1a1a1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e5e0d8;border-radius:8px;">
            <tr>
              <td style="padding:28px 32px 8px;">
                <p style="margin:0;font-family:Georgia,serif;font-size:22px;font-weight:700;color:#1a1a1a;">
                  FinnWise
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 24px;">
                <p style="margin:0 0 12px;font-size:15px;line-height:1.5;">
                  A signal you were watching has fired on an event card you follow.
                </p>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">
                  <strong>{{ card_title }}</strong>
                </p>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#4a4a4a;">
                  This is an informational alert only — not investment advice. Open FinnWise to read the
                  updated card and your logged prediction in context.
                </p>
                <p style="margin:0 0 28px;">
                  <a
                    href="{{ thread_url }}"
                    style="display:inline-block;padding:12px 20px;background:#1a4d3e;color:#ffffff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600;"
                  >
                    View in FinnWise
                  </a>
                </p>
                <p style="margin:0;font-size:12px;line-height:1.5;color:#6b6b6b;">
                  <a href="{{ unsubscribe_url }}" style="color:#6b6b6b;">Unsubscribe from signal emails</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
