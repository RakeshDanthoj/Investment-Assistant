name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
        working-directory: .
      - name: Budget assertion smoke test
        run: pnpm perf:lighthouse:budget-test
      - name: Mobile Lighthouse (Pulse + Thread)
        run: pnpm perf:lighthouse -- --no-save
        env:
          LIGHTHOUSE_BASE_URL: https://investment-assistant-frontend.vercel.app
          # Omit empty secret so scripts/lighthouse.mjs uses DEFAULT_CARD_ID
          LIGHTHOUSE_THREAD_CARD_ID: ${{ secrets.LIGHTHOUSE_THREAD_CARD_ID || 'e708b82c-f7c7-45e7-a59b-6b66dac8927a' }}
      - name: Desktop Lighthouse (Pulse + Thread)
        run: pnpm perf:lighthouse:desktop -- --no-save
        env:
          LIGHTHOUSE_BASE_URL: https://investment-assistant-frontend.vercel.app
          LIGHTHOUSE_THREAD_CARD_ID: ${{ secrets.LIGHTHOUSE_THREAD_CARD_ID || 'e708b82c-f7c7-45e7-a59b-6b66dac8927a' }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -e "./backend[dev]"
      - name: Ruff
        run: python -m ruff check backend
      - name: Pytest
        run: python -m pytest -q backend/tests
